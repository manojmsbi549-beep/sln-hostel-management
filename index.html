function load(){try{const d=JSON.parse(localStorage.getItem('slnHostelData')||'{}');for(const k of Object.keys(state))state[k]=Array.isArray(d[k])?d[k]:[]}catch(e){}}function save(){localStorage.setItem('slnHostelData',JSON.stringify(state))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function activeStudents(){return state.students.filter(s=>s.status!=='left')}function roomUse(r){return activeStudents().filter(s=>s.room===r.number).length}function monthPaid(studentId,m=monthNow()){return state.payments.filter(p=>p.studentId===studentId&&p.month===m).reduce((a,p)=>a+Number(p.amount||0),0)}function due(s,m=monthNow()){return Math.max(0,Number(s.fee||5500)-monthPaid(s.id,m))}function monthIncome(m=monthNow()){return state.payments.filter(p=>p.month===m).reduce((a,p)=>a+Number(p.amount||0),0)}function monthExpense(m=monthNow()){return state.expenses.filter(e=>e.date&&e.date.slice(0,7)===m).reduce((a,e)=>a+Number(e.amount||0),0)}function totalDue(){return activeStudents().reduce((a,s)=>a+due(s),0)}
const navItems=[['dashboard','⌂'],['students','♙'],['rooms','▦'],['fees','₹'],['reminders','🔔'],['expenses','↗'],['reports','▤']];function renderNav(){$('nav').innerHTML=navItems.map(([k,ic])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${ic} ${t(k)}</button>`).join('')}
function go(p){page=p;editingId=null;render()}function render(){renderNav();const m=$('main');if(page==='dashboard')m.innerHTML=dashboard();if(page==='students')m.innerHTML=studentsPage();if(page==='rooms')m.innerHTML=roomsPage();if(page==='fees')m.innerHTML=feesPage();if(page==='reminders')m.innerHTML=remindersPage();if(page==='expenses')m.innerHTML=expensesPage();if(page==='reports')m.innerHTML=reportsPage();}
function heading(title,sub,button=''){return `<div class="heading"><div><h2>${title}</h2><div class="sub">${sub||''}</div></div>${button}</div>`}function metric(label,value,hint){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint||''}</div></div>`}function dashboard(){let roomsCap=state.rooms.reduce((a,r)=>a+Number(r.capacity||0),0);let occupied=activeStudents().length;return `${heading(t('overview'),t('monthlyDefault'))}<div class="cards">${metric(t('occupancy'),occupied,`${roomsCap?Math.max(0,roomsCap-occupied):'—'} ${t('available').toLowerCase()}`)}${metric(t('collected'),money(monthIncome()),monthLabel(monthNow()))}${metric(t('pending'),money(totalDue()),t('activeCount'))}${metric(t('expensesMonth'),money(monthExpense()),monthLabel(monthNow()))}</div><div class="grid2"><section class="panel"><h3>${t('quick')}</h3><div class="quick"><button class="btn" onclick="openStudentForm()">＋ ${t('addStudent')}</button><button class="btn secondary" onclick="go('fees')">＋ ${t('collectFee')}</button><button class="btn secondary" onclick="go('expenses')">＋ ${t('addExpense')}</button><button class="btn secondary" onclick="go('rooms')">＋ ${t('addRoom')}</button></div><h3 style="margin-top:24px">${t('recent')}</h3><div class="list">${state.payments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5).map(p=>{let s=state.students.find(x=>x.id===p.studentId);return `<div class="item"><div><strong>${esc(s?.name||'—')}</strong><small>${esc(p.date)} · ${esc(monthLabel(p.month))}</small></div><strong>${money(p.amount)}</strong></div>`}).join('')||`<div class="empty">${t('noPayments')}</div>`}</div></section><section class="panel"><h3>${t('pending')} · ${monthLabel(monthNow())}</h3><div class="list">${activeStudents().filter(s=>due(s)>0).sort((a,b)=>due(b)-due(a)).slice(0,8).map(s=>`<div class="item"><div><strong>${esc(s.name)}</strong><small>${t('room')}: ${esc(s.room||'—')} · ${esc(s.phone||'')}</small></div><span class="pill pending">${money(due(s))}</span></div>`).join('')||`<div class="empty">${t('noData')}</div>`}</div></section></div>`}
function studentsPage(){let q=window.studentSearch||'';return `${heading(t('studentsTitle'),`${activeStudents().length} ${t('activeCount')}`,`<button class="btn" onclick="openStudentForm()">＋ ${t('addStudent')}</button>`)}<div id="studentFormSlot"></div><div class="tools"><input placeholder="${t('search')}" value="${esc(q)}" oninput="window.studentSearch=this.value;render()"><select onchange="window.studentStatus=this.value;render()"><option value="all">${t('allStatus')}</option><option value="active" ${window.studentStatus==='active'?'selected':''}>${t('active')}</option><option value="left" ${window.studentStatus==='left'?'selected':''}>${t('left')}</option></select><button class="btn secondary" onclick="exportCSV('students')">${t('export')}</button></div><div class="tablewrap"><table><thead><tr><th>${t('name')}</th><th>${t('phone')}</th><th>${t('room')}</th><th>${t('joined')}</th><th>${t('fee')}</th><th>${t('balance')}</th><th>${t('status')}</th><th>${t('action')}</th></tr></thead><tbody>${state.students.filter(s=>(!q||[s.name,s.phone,s.room].join(' ').toLowerCase().includes(q.toLowerCase()))&&(window.studentStatus==='left'?s.status==='left':window.studentStatus==='active'?s.status!=='left':true)).map(s=>`<tr><td><strong>${esc(s.name)}</strong><br><small>${esc(s.emergency||'')}</small></td><td>${esc(s.phone||'—')}</td><td>${esc(s.room||'—')}</td><td>${esc(s.join||'')}</td><td>${money(s.fee)}</td><td><span class="pill ${due(s)>0&&s.status!=='left'?'pending':''}">${s.status==='left'?'—':money(due(s))}</span></td><td><span class="pill ${s.status==='left'?'vacant':''}">${t(s.status==='left'?'left':'active')}</span></td><td><button class="btn secondary" onclick="editStudent('${s.id}')">${t('edit')}</button> ${s.status!=='left'?`<button class="btn danger" onclick="checkoutStudent('${s.id}')">${t('checkout')}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">${t('noStudents')}</td></tr>`}</tbody></table></div>`}
function openStudentForm(){page='students';renderNav();$('studentFormSlot')?.scrollIntoView();const slot=$('studentFormSlot');if(!slot)return;const s=editingId?state.students.find(x=>x.id===editingId):{};slot.innerHTML=`<section class="panel" style="margin-bottom:14px"><h3>${editingId?t('edit'):t('addStudent')}</h3><form onsubmit="saveStudent(event)"><div class="fieldgrid"><div class="field"><label>${t('name')} *</label><input name="name" required value="${esc(s.name||'')}"></div><div class="field"><label>${t('phone')}</label><input name="phone" inputmode="tel" value="${esc(s.phone||'')}"></div><div class="field"><label>${t('emergency')}</label><input name="emergency" inputmode="tel" value="${esc(s.emergency||'')}"></div><div class="field"><label>${t('room')}</label><select name="room"><option value="">—</option>${state.rooms.map(r=>`<option value="${esc(r.number)}" ${s.room===r.number?'selected':''}>${esc(r.number)} (${Math.max(0,r.capacity-roomUse(r)+(s.room===r.number?1:0))} ${t('available').toLowerCase()})</option>`).join('')}</select></div><div class="field"><label>${t('join')}</label><input name="join" type="date" value="${esc(s.join||today())}"></div><div class="field"><label>${t('fee')}</label><input name="fee" type="number" min="0" step="1" value="${esc(s.fee??5500)}"></div><div class="field"><label>${t('registration')}</label><input name="registration" type="number" min="0" value="${esc(s.registration||0)}"></div><div class="field"><label>${t('maintenance')}</label><input name="maintenance" type="number" min="0" value="${esc(s.maintenance||0)}"></div><div class="field" style="grid-column:1/-1"><label>${t('notes')}</label><input name="notes" value="${esc(s.notes||'')}"></div></div><div class="formactions"><button type="button" class="btn secondary" onclick="editingId=null;render()">${t('cancel')}</button><button class="btn">${t('save')}</button></div></form></section>`;slot.scrollIntoView({behavior:'smooth',block:'start'})}
function editStudent(i){editingId=i;openStudentForm()}function saveStudent(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return alert(t('nameRequired'));let room=f.get('room');if(room){let r=state.rooms.find(r=>r.number===room),used=roomUse(r)-(editingId&&state.students.find(s=>s.id===editingId)?.room===room?1:0);if(r&&used>=r.capacity)return alert(t('roomOccupied'))}let old=editingId?state.students.find(s=>s.id===editingId):null;let s={id:editingId||id(),name,phone:f.get('phone'),emergency:f.get('emergency'),room,join:f.get('join')||today(),fee:Number(f.get('fee')||5500),registration:Number(f.get('registration')||0),maintenance:Number(f.get('maintenance')||0),notes:f.get('notes'),status:old?.status||'active'};if(old)state.students=state.students.map(x=>x.id===editingId?s:x);else state.students.push(s);editingId=null;save();render()}
function checkoutStudent(i){if(!confirm(t('confirmCheckout')))return;state.students=state.students.map(s=>s.id===i?{...s,status:'left',leftDate:today()}:s);save();render()}
function roomsPage(){return `${heading(t('roomTitle'),t('capacityHint'),`<button class="btn" onclick="openRoomForm()">＋ ${t('addRoom')}</button>`)}<div id="roomFormSlot"></div><div class="cards">${metric(t('totalStudents'),activeStudents().length,'')}${metric(t('occupied'),state.rooms.reduce((a,r)=>a+roomUse(r),0),'')}${metric(t('available'),state.rooms.reduce((a,r)=>a+Math.max(0,r.capacity-roomUse(r)),0),'')}${metric(t('roomStatus'),state.rooms.length,'')}</div><div class="tablewrap"><table><thead><tr><th>${t('roomNumber')}</th><th>${t('capacity')}</th><th>${t('occupied')}</th><th>${t('available')}</th><th>${t('roomStatus')}</th><th>${t('action')}</th></tr></thead><tbody>${state.rooms.map(r=>`<tr><td><strong>${esc(r.number)}</strong></td><td>${r.capacity}</td><td>${roomUse(r)}</td><td>${Math.max(0,r.capacity-roomUse(r))}</td><td><span class="pill ${roomUse(r)>=r.capacity?'pending':'vacant'}">${roomUse(r)>=r.capacity?t('occupied'):t('available')}</span></td><td><button class="btn danger" onclick="deleteRoom('${r.id}')">${t('delete')}</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">${t('noRooms')}</td></tr>`}</tbody></table></div>`}
function openRoomForm(){const slot=$('roomFormSlot');slot.innerHTML=`<section class="panel" style="margin-bottom:14px"><form onsubmit="saveRoom(event)"><div class="fieldgrid"><div class="field"><label>${t('roomNumber')}</label><input name="number" required placeholder="e.g. 101"></div><div class="field"><label>${t('capacity')}</label><input name="capacity" type="number" min="1" max="100" required value="4"></div></div><div class="formactions"><button class="btn">${t('save')}</button></div></form></section>`}function saveRoom(e){e.preventDefault();let f=new FormData(e.target),number=f.get('number').trim(),capacity=Number(f.get('capacity'));if(state.rooms.some(r=>r.number.toLowerCase()===number.toLowerCase()))return alert('Room already exists');state.rooms.push({id:id(),number,capacity});save();render()}function deleteRoom(i){let r=state.rooms.find(x=>x.id===i);if(r&&activeStudents().some(s=>s.room===r.number))return alert('Move students out of this room first.');if(confirm(t('confirmDelete'))){state.rooms=state.rooms.filter(x=>x.id!==i);save();render()}}
function feesPage(){let m=window.feeMonth===undefined?monthNow():window.feeMonth;return `${heading(t('feeTitle'),t('monthlyDefault'),`<button class="btn secondary" onclick="exportCSV('payments')">${t('export')}</button>`)}<section class="panel" style="margin-bottom:14px"><h3>${t('recordPayment')}</h3><form onsubmit="savePayment(event)"><div class="fieldgrid"><div class="field"><label>${t('selectStudent')}</label><select name="studentId" required><option value="">—</option>${activeStudents().map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.room||'—')}</option>`).join('')}</select></div><div class="field"><label>${t('amount')}</label><input name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>${t('month')}</label><input name="month" type="month" value="${m}" required></div><div class="field"><label>${t('date')}</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>${t('method')}</label><select name="method"><option>${t('cash')}</option><option>UPI</option><option>${t('bank')}</option><option>${t('other')}</option></select></div><div class="field"><label>${t('purpose')}</label><select name="purpose"><option>Monthly hostel fee</option><option>Registration fee</option><option>Maintenance fee</option><option>Other</option></select></div></div><div class="formactions"><button class="btn">${t('recordPayment')}</button></div></form></section><div class="cards">${metric(t('collected'),money(monthIncome(m)),monthLabel(m))}${metric(t('pending'),money(activeStudents().reduce((a,s)=>a+due(s,m),0)),monthLabel(m))}${metric(t('activeCount'),activeStudents().length,'')}${metric(t('totalStudents'),state.students.length,'')}</div><div class="tools"><label style="align-self:center">${t('filterMonth')}</label><input type="month" value="${m}" onchange="window.feeMonth=this.value;render()"><button class="btn secondary" onclick="window.feeMonth='';render()">${t('allMonths')}</button></div><div class="tablewrap"><table><thead><tr><th>${t('receiptNo')}</th><th>${t('date')}</th><th>${t('student')}</th><th>${t('month')}</th><th>${t('purpose')}</th><th>${t('amount')}</th><th>${t('method')}</th><th>${t('action')}</th></tr></thead><tbody>${state.payments.filter(p=>!m||p.month===m).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{let s=state.students.find(x=>x.id===p.studentId);return `<tr><td>${esc(p.receipt)}</td><td>${esc(p.date)}</td><td>${esc(s?.name||'—')}</td><td>${esc(monthLabel(p.month))}</td><td>${esc(p.purpose||'')}</td><td><strong>${money(p.amount)}</strong></td><td>${esc(p.method)}</td><td><button class="btn secondary" onclick="printReceipt('${p.id}')">${t('receipt')}</button></td></tr>`}).join('')||`<tr><td colspan="8" class="empty">${t('noPayments')}</td></tr>`}</tbody></table></div>`}
function savePayment(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!(amount>0))return alert(t('amountRequired'));let p={id:id(),receipt:'SLN-'+Date.now().toString().slice(-7),studentId:f.get('studentId'),amount,month:f.get('month'),date:f.get('date'),method:f.get('method'),purpose:f.get('purpose')};state.payments.push(p);save();render();setTimeout(()=>printReceipt(p.id),100)}function printReceipt(i){let p=state.payments.find(x=>x.id===i),s=state.students.find(x=>x.id===p?.studentId);if(!p)return;let w=window.open('','_blank','width=700,height=700');if(!w){alert('Allow pop-ups to print receipt.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${t('receiptTitle')}</title><style>body{font:16px Arial,sans-serif;padding:35px;color:#182b25}.receipt{max-width:620px;margin:auto;border:2px solid #1c6658;padding:28px;border-radius:10px}.center{text-align:center}.line{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ddd}.amount{font-size:26px;font-weight:bold;color:#1c6658}.small{color:#555;font-size:12px}</style></head><body><div class="receipt"><div class="center"><h2>SLN BOYS HOSTEL</h2><p>Hostel Fee Payment Receipt</p><hr></div><div class="line"><span>${t('receiptNo')}</span><b>${esc(p.receipt)}</b></div><div class="line"><span>${t('date')}</span><b>${esc(p.date)}</b></div><div class="line"><span>${t('receivedFrom')}</span><b>${esc(s?.name||'—')}</b></div><div class="line"><span>${t('room')}</span><b>${esc(s?.room||'—')}</b></div><div class="line"><span>${t('month')}</span><b>${esc(monthLabel(p.month))}</b></div><div class="line"><span>${t('towards')}</span><b>${esc(p.purpose||'')}</b></div><div class="line"><span>${t('method')}</span><b>${esc(p.method)}</b></div><div class="line"><span>${t('amount')}</span><span class="amount">${money(p.amount)}</span></div><p class="center">${t('thankyou')}</p><p class="small">Generated by SLN Boys Hostel Management</p><div class="center"><button onclick="window.print()">Print / Save PDF</button></div></div><script>if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}<\/script></body></html>`);w.document.close()}
function remindersFor(studentId,m=monthNow()){return state.reminders.filter(r=>r.studentId===studentId&&r.month===m).length}
function remindersPage(){let m=window.reminderMonth||monthNow();let rows=activeStudents().map(s=>({s,b:due(s,m),n:remindersFor(s.id,m)})).filter(x=>x.b>0);return `${heading(t('reminders'),t('reminderInfo'),`<input aria-label="Month" type="month" value="${m}" onchange="window.reminderMonth=this.value;render()">`)}<div class="notice">${t('automaticNote')}</div><div class="cards">${metric(t('pending'),money(rows.reduce((a,x)=>a+x.b,0)),monthLabel(m))}${metric(t('activeCount'),rows.length,monthLabel(m))}${metric(t('reminderCount'),state.reminders.filter(r=>r.month===m).length,monthLabel(m))}${metric('Maximum per guest','3','Each fee month')}</div><div class="tablewrap"><table><thead><tr><th>${t('student')}</th><th>${t('phone')}</th><th>${t('room')}</th><th>${t('balance')}</th><th>${t('reminderCount')}</th><th>${t('action')}</th></tr></thead><tbody>${rows.map(({s,b,n})=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.phone||'—')}</td><td>${esc(s.room||'—')}</td><td><strong>${money(b)}</strong></td><td>${n}/3</td><td>${n>=3?`<span class="pill pending">${t('maxReminders')}</span>`:`<button class="btn" onclick="sendReminder('${s.id}','${m}')">${t('sendReminder')}</button>`}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">${t('noDue')}</td></tr>`}</tbody></table></div><section class="panel" style="margin-top:14px"><h3>${lang==='te'?'తెలుగు రిమైండర్ నమూనా':'Telugu reminder preview'}</h3><p>నమస్కారం [గెస్ట్ పేరు] గారు, SLN Boys Hostel నెలవారీ ఫీజు ఇంకా బకాయి ఉంది. దయచేసి వీలైనంత త్వరగా చెల్లించండి. ఇప్పటికే చెల్లించి ఉంటే ఈ సందేశాన్ని పట్టించుకోకండి. ధన్యవాదాలు — SLN Boys Hostel నిర్వహణ.</p></section>`}
function sendReminder(studentId,m){let s=state.students.find(x=>x.id===studentId);if(!s)return;let b=due(s,m);if(b<=0){alert(t('noDue'));render();return}let n=remindersFor(studentId,m);if(n>=3)return alert(t('reminderLimit'));let raw=String(s.phone||'').replace(/\D/g,'');if(raw.length===10)raw='91'+raw;else if(raw.startsWith('0')&&raw.length===11)raw='91'+raw.slice(1);if(raw.length<11||raw.length>15)return alert(t('phoneMissing'));let variants=[`నమస్కారం ${s.name} గారు, SLN Boys Hostel నెలవారీ ఫీజు ${money(b)} (నెల: ${monthLabel(m)}) ఇంకా బకాయి ఉంది. దయచేసి వీలైనంత త్వరగా చెల్లించండి. ఇప్పటికే చెల్లించి ఉంటే ఈ సందేశాన్ని పట్టించుకోకండి. ధన్యవాదాలు — SLN Boys Hostel నిర్వహణ.`,`రిమైండర్: ${s.name} గారు, SLN Boys Hostel ఫీజు ${money(b)} (${monthLabel(m)}) ఇంకా చెల్లించాల్సి ఉంది. దయచేసి ఈరోజు చెల్లించి మేనేజ్‌మెంట్‌కు తెలియజేయండి. ఇప్పటికే చెల్లించినట్లయితే క్షమించండి.`,`చివరి రిమైండర్: ${s.name} గారు, SLN Boys Hostel ఫీజు ${money(b)} (${monthLabel(m)}) ఇంకా బకాయి ఉంది. దయచేసి వెంటనే చెల్లించండి లేదా మేనేజ్‌మెంట్‌ను సంప్రదించండి. ఇప్పటికే చెల్లించినట్లయితే ఈ సందేశాన్ని పట్టించుకోకండి.`];let msg=variants[n];let url='https://wa.me/'+raw+'?text='+encodeURIComponent(msg);window.open(url,'_blank');state.reminders.push({id:id(),studentId,month:m,date:today(),number:n+1,amount:b});save();render();alert(t('reminderOpened'))}
function expensesPage(){return `${heading(t('expenseTitle'),'Record hostel operating expenses.',`<button class="btn secondary" onclick="exportCSV('expenses')">${t('export')}</button>`)}<section class="panel" style="margin-bottom:14px"><h3>${t('addExpense')}</h3><form onsubmit="saveExpense(event)"><div class="fieldgrid"><div class="field"><label>${t('purpose')}</label><select name="category"><option>${t('groceries')}</option><option>${t('electricity')}</option><option>${t('rent')}</option><option>${t('maintenanceExp')}</option><option>${t('salary')}</option><option>${t('misc')}</option></select></div><div class="field"><label>${t('amount')}</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>${t('date')}</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>${t('method')}</label><select name="method"><option>${t('cash')}</option><option>UPI</option><option>${t('bank')}</option><option>${t('other')}</option></select></div><div class="field" style="grid-column:1/-1"><label>${t('description')}</label><input name="description" placeholder="Optional details"></div></div><div class="formactions"><button class="btn">${t('recordExpense')}</button></div></form></section><div class="cards">${metric(t('expensesMonth'),money(monthExpense()),monthLabel(monthNow()))}${metric(t('income'),money(monthIncome()),monthLabel(monthNow()))}${metric(t('net'),money(monthIncome()-monthExpense()),monthLabel(monthNow()))}${metric(t('totalExpenses'),money(state.expenses.reduce((a,e)=>a+Number(e.amount),0)),'All time')}</div><div class="tablewrap"><table><thead><tr><th>${t('date')}</th><th>${t('category')}</th><th>${t('description')}</th><th>${t('amount')}</th><th>${t('method')}</th><th>${t('action')}</th></tr></thead><tbody>${state.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description||'—')}</td><td><strong>${money(e.amount)}</strong></td><td>${esc(e.method)}</td><td><button class="btn danger" onclick="deleteExpense('${e.id}')">${t('delete')}</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">${t('noExpenses')}</td></tr>`}</tbody></table></div>`}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!(amount>0))return alert(t('amountRequired'));state.expenses.push({id:id(),category:f.get('category'),amount,date:f.get('date'),method:f.get('method'),description:f.get('description')});save();render()}function deleteExpense(i){if(confirm(t('confirmDelete'))){state.expenses=state.expenses.filter(e=>e.id!==i);save();render()}}
function reportsPage(){let paid=state.payments.reduce((a,p)=>a+Number(p.amount),0),spent=state.expenses.reduce((a,e)=>a+Number(e.amount),0);let months=[...new Set([...state.payments.map(p=>p.month),...state.expenses.map(e=>e.date?.slice(0,7))].filter(Boolean))].sort().reverse();return `${heading(t('reportsTitle'),t('emptyReport'),`<button class="btn secondary" onclick="exportBackup()">${t('backup')}</button>`)}<div class="cards">${metric(t('income'),money(paid),'All time')}${metric(t('totalExpenses'),money(spent),'All time')}${metric(t('net'),money(paid-spent),'All time')}${metric(t('dues'),money(totalDue()),monthLabel(monthNow()))}</div><div class="reportgrid"><section class="panel"><h3>${t('month')} — summary</h3><div class="tablewrap"><table style="min-width:0"><thead><tr><th>${t('month')}</th><th>${t('income')}</th><th>${t('totalExpenses')}</th><th>${t('net')}</th></tr></thead><tbody>${months.map(m=>{let inc=monthIncome(m),ex=monthExpense(m);return `<tr><td>${esc(monthLabel(m))}</td><td>${money(inc)}</td><td>${money(ex)}</td><td>${money(inc-ex)}</td></tr>`}).join('')||`<tr><td colspan="4" class="empty">${t('noData')}</td></tr>`}</tbody></table></div></section><section class="panel"><h3>${t('dues')} — ${monthLabel(monthNow())}</h3><div class="tablewrap"><table style="min-width:0"><thead><tr><th>${t('student')}</th><th>${t('room')}</th><th>${t('paid')}</th><th>${t('balance')}</th></tr></thead><tbody>${activeStudents().map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.room||'—')}</td><td>${money(monthPaid(s.id))}</td><td>${money(due(s))}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">${t('noData')}</td></tr>`}</tbody></table></div><button class="btn secondary" style="margin-top:12px" onclick="exportCSV('dues')">${t('export')}</button></section><section class="panel"><h3>${t('backup')} & ${t('restore')}</h3><p class="sub">${t('restoreHint')}</p><div class="quick"><button class="btn" onclick="exportBackup()">${t('backup')}</button><label class="btn secondary" style="display:inline-flex;align-items:center;justify-content:center">${t('chooseFile')}<input type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(event)"></label></div></section><section class="panel"><h3>Data & privacy</h3><p class="sub">This starter app stores records in the browser on this device. Download a backup regularly. It does not sync to other phones or provide cloud storage or user login.</p><button class="btn danger" onclick="clearAll()">Clear all data</button></section></div>`}
function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});download(blob,'SLN_Hostel_Backup_'+today()+'.json');alert(t('backupOk'))}function restoreBackup(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.students)||!Array.isArray(d.payments)||!Array.isArray(d.expenses)||!Array.isArray(d.rooms))throw 0;if(!confirm(t('restoreHint')))return;for(let k of Object.keys(state))state[k]=Array.isArray(d[k])?d[k]:[];save();render();alert(t('restored'))}catch(err){alert(t('invalidBackup'))}};reader.readAsText(file)}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(type){let rows=[],name=type; if(type==='students'){rows=[['Name','Phone','Emergency contact','Room','Join date','Monthly fee','Registration fee','Maintenance fee','Status'],...state.students.map(s=>[s.name,s.phone,s.emergency,s.room,s.join,s.fee,s.registration,s.maintenance,s.status])]}else if(type==='payments'){rows=[['Receipt','Date','Student','Room','Month','Purpose','Amount','Method'],...state.payments.map(p=>{let s=state.students.find(x=>x.id===p.studentId);return[p.receipt,p.date,s?.name,s?.room,p.month,p.purpose,p.amount,p.method]})]}else if(type==='expenses'){rows=[['Date','Category','Description','Amount','Method'],...state.expenses.map(e=>[e.date,e.category,e.description,e.amount,e.method])]}else{rows=[['Student','Room','Month','Paid','Balance'],...activeStudents().map(s=>[s.name,s.room,monthNow(),monthPaid(s.id),due(s)])]}download(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),'SLN_Hostel_'+name+'_'+today()+'.csv')}
function clearAll(){if(confirm('This permanently clears all hostel data saved in this browser. Download a backup first. Continue?')&&confirm('Are you absolutely sure?')){for(let k of Object.keys(state))state[k]=[];save();render()}}function toggleLang(){lang=lang==='en'?'te':'en';$('langBtn').textContent=lang==='en'?'తెలుగు':'English';render()}load();$('langBtn').textContent='తెలుగు';render();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
